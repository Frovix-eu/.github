name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"  
  workflow_dispatch:       
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: w1nlyx
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#C724B1
            dist/snake.gif?palette=github-dark&color_snake=#C724B1

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
