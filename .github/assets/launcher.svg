<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 225 56" width="225" height="56" role="img" aria-label="LAUNCHER">
  <title>LAUNCHER</title>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A222C"/>
      <stop offset="100%" stop-color="#12161C"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E7CC4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8FC9EE" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <style>
    @font-face { font-family:"FvxBtn"; font-weight:600;
      src:url("data:font/woff;base64,") format("woff"); }
    @keyframes glow { 0%,100% { opacity:.55 } 50% { opacity:1 } }
    .edge { animation: glow 3.4s ease-in-out infinite }
  </style>
  <rect x="1.5" y="1.5" width="222" height="53" rx="12" fill="url(#face)"/>
  <rect class="edge" x="1.5" y="1.5" width="222" height="53" rx="12" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <g transform="translate(35,28.0)">
      <line x1="0" y1="-9" x2="0" y2="4" stroke="#8FC9EE" stroke-width="2" stroke-linecap="round"/>
      <polyline points="-5,-1 0,4 5,-1" fill="none" stroke="#8FC9EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-8" y1="9" x2="8" y2="9" stroke="#8FC9EE" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="56" y="34.0" font-family="FvxBtn, Space Grotesk, Segoe UI, Arial, sans-serif"
